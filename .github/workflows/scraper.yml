name: Scraper

on:
  schedule:
    # Every hour at :00
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        working-directory: scraper
        run: python main.py --workers 15

      - name: Sync leaderboard from API
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        working-directory: scraper
        run: python sync_leaderboard.py

      - name: Fetch player ratings
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        working-directory: scraper
        run: python fetch_ratings.py

      - name: Update team avg ratings
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        working-directory: scraper
        run: python update_team_ratings.py

      - name: Backfill match scores
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        working-directory: scraper
        run: python backfill_scores.py

      - name: Backfill player positions
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        working-directory: scraper
        run: python backfill_positions.py
