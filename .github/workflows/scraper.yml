name: Scraper

on:
  schedule:
    - cron: '0 13,16,19,22 * * *'   # 15:00, 18:00, 21:00, 01:00 Europe/Rome (DST, UTC+2)
    - cron: '0 2 * * *'   # ogni notte alle 2:00 (sync-meta)
  workflow_dispatch:        # run manuale dal dashboard GitHub

jobs:
  # ── Ogni ora: nuove partite ─────────────────────────────────────────
  sync-matches:
    name: Sync new matches
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Sync new matches (API list mode)
        working-directory: scraper
        env:
          DIRECT_URL: "${{ secrets.DIRECT_URL }}"
        run: python sync_new.py --from-api

  # ── Ogni notte alle 2:00: metadata ─────────────────────────────────
  sync-meta:
    name: Sync teams / tournaments / ratings
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Sync teams metadata
        working-directory: scraper
        env:
          DIRECT_URL: "${{ secrets.DIRECT_URL }}"
        run: python sync_teams.py

      - name: Download new team logos
        working-directory: scraper
        env:
          DIRECT_URL: "${{ secrets.DIRECT_URL }}"
        run: python download_logos.py

      - name: Commit new logos + manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/team-logos src/lib/local-logos.json
          if git diff --cached --quiet; then
            echo "No logo changes to commit."
          else
            git commit -m "chore(logos): sync team logos [skip ci]"
            git push
          fi

      - name: Sync tournaments
        working-directory: scraper
        env:
          DIRECT_URL: "${{ secrets.DIRECT_URL }}"
        run: python sync_tournaments.py

      - name: Sync player IDs
        timeout-minutes: 15
        working-directory: scraper
        env:
          DIRECT_URL: "${{ secrets.DIRECT_URL }}"
        run: python sync_player_ids.py

      - name: Fetch player ratings
        working-directory: scraper
        env:
          DIRECT_URL: "${{ secrets.DIRECT_URL }}"
        run: python fetch_ratings.py

      - name: Update team avg ratings
        working-directory: scraper
        env:
          DIRECT_URL: "${{ secrets.DIRECT_URL }}"
        run: python update_team_ratings.py

      - name: Backfill missing match records
        timeout-minutes: 12
        working-directory: scraper
        env:
          DIRECT_URL: "${{ secrets.DIRECT_URL }}"
        run: python sync_missing_matches.py --workers 20
