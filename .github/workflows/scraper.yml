name: Scraper

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 13,16,19,22 * * *'   # 15:00, 18:00, 21:00, 01:00 Europe/Rome (DST, UTC+2)
    - cron: '0 2 * * *'   # ogni notte alle 2:00 (sync-meta)
  workflow_dispatch:        # run manuale dal dashboard GitHub

jobs:
  # ── Ogni ora: nuove partite ─────────────────────────────────────────
  sync-matches:
    name: Sync new matches
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Validate DIRECT_URL (safe)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          dsn = os.getenv("DIRECT_URL", "")
          if not dsn:
              raise SystemExit("DIRECT_URL is empty or missing")

          p = urlparse(dsn)
          host = p.hostname or ""
          db = (p.path or "").lstrip("/")
          print(f"DIRECT_URL present: scheme={p.scheme}, host={host}, port={p.port}, db={db}")
          PY

      - name: Sync new matches (API list mode)
        working-directory: scraper
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python sync_new.py --from-api

  # ── Ogni notte alle 2:00: metadata ─────────────────────────────────
  sync-meta:
    name: Sync teams / tournaments / ratings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Sync teams metadata
        working-directory: scraper
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python sync_teams.py

      - name: Sync tournaments
        working-directory: scraper
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python sync_tournaments.py

      - name: Sync player IDs
        working-directory: scraper
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python sync_player_ids.py

      - name: Fetch player ratings
        working-directory: scraper
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python fetch_ratings.py

      - name: Update team avg ratings
        working-directory: scraper
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python update_team_ratings.py
